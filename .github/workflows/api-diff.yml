# Report-only API diff of the library modules against the latest 3.4 release; never fails the build.
name: API Diff
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline git ref'
        required: false
        default: 'v3.4.0'
jobs:
  api-diff:
    name: API Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: API diff
        continue-on-error: true
        run: scripts/api-diff.sh "${{ github.event.inputs.baseline || 'v3.4.0' }}" build/api-diff

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-diff
          path: build/api-diff
          if-no-files-found: warn
