# TEMPORARY (D49, removed before merge): the published POM and Gradle module metadata of every cosid.spring project,
# main against this branch, so that the change of the versions they require is seen in full.
name: TMP D49 POM diff
on:
  push:
    branches: [ build/spring-boot-4.1.2-only ]
permissions:
  contents: read
jobs:
  pom-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Publications of main and of this branch
        run: |
          tasks=""
          for p in spring:autoconfigure spring:starter integrations:jackson integrations:mybatis integrations:spring-data-jdbc \
                   integrations:activiti integrations:flowable integrations:axon; do
            tasks="$tasks :$p:generatePomFileForMavenLibraryPublication :$p:generateMetadataFileForMavenLibraryPublication"
          done
          collect() {
            mkdir -p "$1"
            for f in $(find spring integrations -path '*/build/publications/mavenLibrary/*' \( -name pom-default.xml -o -name module.json \)); do
              module=$(echo "$f" | cut -d/ -f1-2 | tr / -)
              # The build's own version and timestamps differ by nature.
              sed -E 's/"buildId": "[^"]*"//' "$f" > "$1/$module-$(basename "$f")"
            done
          }
          head=$(git rev-parse HEAD)
          git checkout -q origin/main
          ./gradlew -q $tasks
          collect /tmp/main
          ./gradlew -q clean
          git checkout -q "$head"
          ./gradlew -q $tasks
          collect /tmp/branch
          diff -ru /tmp/main /tmp/branch > /tmp/d49.diff || true
          cat /tmp/d49.diff
          echo "### Boot BOM import in the branch's POMs (expected none)"
          grep -l "spring-boot-dependencies" /tmp/branch/*.xml || echo "none"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: d49-pom-diff
          path: |
            /tmp/main
            /tmp/branch
            /tmp/d49.diff
