name: Packages Deploy
on:
  release:
    # published: not when a draft release is saved (created fires for drafts too).
    types: [published]

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Tag matches gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match version=${version} in gradle.properties (expected v${version})"
            exit 1
          fi
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version=${version} is not a semantic version"
            exit 1
          fi
  # Publishing to Central cannot be undone: build, test and stage everything once before any deploy job runs.
  verify-build:
    name: Verify the build
    needs: [ verify-version ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # check runs every test (containers included), Checkstyle, SpotBugs, checkPublishedMetadata, checkBom and the
      # dependency rules; publishing to the project's build repository signs and assembles every artifact.
      - name: Check and stage
        run: scripts/gradle-retry.sh check javadoc publishAllPublicationsToProjectBuildRepoRepository
        env:
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
  github-deploy:
    needs: [ verify-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Publish package
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
  central-deploy:
    needs: [ verify-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Publish package
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
  # The offline migration tool (09-migration.md) is not published to Maven: the release carries the fat jar.
  migration-jar:
    name: Attach cosid-migration.jar
    needs: [ verify-build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build the fat jar
        run: ./gradlew :migration:shadowJar

      - name: Upload to the release
        run: gh release upload "$GITHUB_REF_NAME" migration/build/libs/cosid-migration.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
