// Temporary (deps audit): prints every resolved module of the alert groups, per project and configuration.
def wanted = ~/^(io\.netty|com\.fasterxml\.jackson\.core|tools\.jackson\.core|org\.apache\.zookeeper|org\.apache\.httpcomponents\.(core5|client5)|org\.xerial\.snappy|com\.google\.guava|org\.mybatis|org\.codehaus\.plexus|org\.apache\.commons|org\.jetbrains\.kotlin):(netty-.*|jackson-(core|databind)|zookeeper|httpcore5.*|httpclient5|snappy-java|guava|mybatis|plexus-utils|commons-lang3|kotlin-gradle-plugin)$/
def audit = { p, String where, Iterable cs ->
    cs.findAll { it.canBeResolved }.each { c ->
        try {
            c.incoming.resolutionResult.allComponents.each { comp ->
                def m = comp.moduleVersion
                if (m != null && "${m.group}:${m.name}" ==~ wanted) {
                    def from = comp.dependents.collect { d -> d.from.moduleVersion ? "${d.from.moduleVersion.group}:${d.from.moduleVersion.name}:${d.from.moduleVersion.version}" : d.from.id.displayName }.unique().join(',')
                    println "AUDIT\t${p.path}\t${where}${c.name}\t${m.group}:${m.name}\t${m.version}\t${from}"
                }
            }
        } catch (e) {
            println "AUDITERR\t${p.path}\t${where}${c.name}\t${e.message?.readLines()?.first()}"
        }
    }
}
allprojects { p ->
    p.tasks.register('auditDeps') {
        doLast {
            audit(p, '', p.configurations)
            audit(p, 'buildscript:', p.buildscript.configurations)
        }
    }
}
