# TEMPORARY (D50, removed before merge): judges the raw JMH JSON of the eighth release gate (run 40887469149,
# be35de36) again with this branch's benchmark/compare, group by group, first run and re-run as run-release does, and
# joins the groups with benchmark/aggregate-release. The report goes to the job summary and the d50-rejudged artifact.
name: TMP D50 re-judge of gate 40887469149
on:
  push:
    branches: [ feat/benchmark-latency-floor ]
permissions:
  contents: read
  actions: read
jobs:
  rejudge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the groups of the eighth gate
        uses: actions/download-artifact@v4
        with:
          run-id: 40887469149
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-gate-*
          path: build/rejudge/downloaded

      - name: Judge each group again and join them
        run: |
          groups=()
          for dir in build/rejudge/downloaded/release-gate-*; do
            case "${dir##*/}" in release-gate-report | release-gate-summary) continue ;; esac
            group="build/rejudge/groups/${dir##*/release-gate-}"
            mkdir -p "$(dirname "$group")" && cp -r "$dir" "$group"
            groups+=("$group")
          done
          for group in "${groups[@]}"; do
            python3 -I - "$group" <<'PY'
          import json, os, subprocess, sys
          group = sys.argv[1]
          path = lambda name: os.path.join(group, name)
          base, cand = path("baseline-4x.json"), path("v5.json")
          # The first run alone, as run-release judges it before the re-run.
          subprocess.run(["benchmark/compare", base, cand, "--failed", path("failed-first.json")], stdout=subprocess.DEVNULL)
          args = ["benchmark/compare", base, cand, "--report", path("comparison.md"), "--failed", path("failed-final.json"),
                  "--warned", path("warned-final.json")]
          if os.path.exists(path("rerun-baseline-4x.json")) and os.path.exists(path("rerun-v5.json")):
              args += ["--rerun", path("rerun-baseline-4x.json"), path("rerun-v5.json")]
          status = subprocess.run(args, stdout=subprocess.DEVNULL).returncode
          load = lambda name: json.load(open(path(name)))
          verdict = load("verdict.json")
          before = {"status": verdict["status"], "failed": verdict["failed"], "warned": verdict.get("warned", [])}
          verdict.update({"failedFirstRun": load("failed-first.json"), "failed": load("failed-final.json"),
                          "warned": load("warned-final.json"), "status": status})
          json.dump(verdict, open(path("verdict.json"), "w"), indent=2)
          # The group report: its header as run-release wrote it, then the comparison by D50.
          report = open(path("report.md")).read()
          header = report.split("\n## ", 1)[0] if "\n## " in report else report
          comparison = open(path("comparison.md")).read().split("\n", 1)[1]
          note = ("\n> Judged again by D50 (`benchmark/compare` of feat/benchmark-latency-floor) on the raw JSON of "
                  "[run 40887469149](https://github.com/Ahoo-Wang/CosId/actions/runs/40887469149).\n")
          open(path("report.md"), "w").write(header.rstrip("\n") + "\n" + note + "\n" + comparison)
          print(f"{os.path.basename(group)}: status {before['status']} -> {status}; failed {len(before['failed'])} -> {len(verdict['failed'])};"
                f" warned {len(before['warned'])} -> {len(verdict['warned'])}")
          for row in verdict["failed"]:
              print("  still FAIL:", json.dumps(row))
          PY
          done
          status=0
          benchmark/aggregate-release build/rejudge/report "${groups[@]}" || status=$?
          cat build/rejudge/report/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "aggregate-release status $status"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d50-rejudged
          path: |
            build/rejudge/report/report.md
            build/rejudge/report/baseline-4x.md
            build/rejudge/groups/*/verdict.json
            build/rejudge/groups/*/report.md
