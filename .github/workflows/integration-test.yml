name: Integration Test
on:
  pull_request:
    paths-ignore:
      - 'cosid-benchmark/**'
      - 'docs/**'
      - 'document/**'
      - 'documentation/**'
      - 'examples/**'
      - 'wiki/**'
env:
  CI: true
permissions:
  contents: read

jobs:
  cosid-core-test:
    name: CosId Core Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Core
        run: scripts/gradle-retry.sh cosid-core:clean cosid-core:check

  # Publishing builds the javadoc of every module: a broken reference fails the release otherwise.
  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Javadoc
        run: scripts/gradle-retry.sh javadoc

  cosid-sharding-test:
    name: CosId Sharding Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Sharding
        run: scripts/gradle-retry.sh cosid-sharding:clean cosid-sharding:check

  cosid-accessor-test:
    name: CosId Accessor Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Accessor
        run: scripts/gradle-retry.sh cosid-accessor:clean cosid-accessor:check

  cosid-jackson-test:
    name: CosId Jackson Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Jackson
        run: scripts/gradle-retry.sh cosid-jackson:clean cosid-jackson:check

  cosid-axon-test:
    name: CosId Axon Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Axon
        run: scripts/gradle-retry.sh cosid-axon:clean cosid-axon:check

  cosid-activiti-test:
    name: CosId Activiti Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Activiti
        run: scripts/gradle-retry.sh cosid-activiti:clean cosid-activiti:check

  cosid-flowable-test:
    name: CosId Flowable Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Flowable
        run: scripts/gradle-retry.sh cosid-flowable:clean cosid-flowable:check

  cosid-mybatis-test:
    name: CosId Mybatis Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Mybatis
        run: scripts/gradle-retry.sh cosid-mybatis:clean cosid-mybatis:check

  cosid-spring-jdbc-test:
    name: CosId Spring Jdbc Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Spring-Jdbc
        run: scripts/gradle-retry.sh cosid-spring-data-jdbc:clean cosid-spring-data-jdbc:check

  cosid-spring-redis-test:
    name: CosId Spring Redis Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Spring-Redis
        env:
          COSID_TEST_REDIS_URI: redis://localhost:6379
        run: scripts/gradle-retry.sh cosid-spring-redis:clean cosid-spring-redis:check

      # The real-Redis tests skip themselves without Redis: make sure they really ran.
      - name: Check real Redis tests ran
        run: |
          status=0
          reports=$(ls cosid-spring-redis/build/test-results/test/TEST-*ContractTest.xml cosid-spring-redis/build/test-results/test/TEST-*RedisTest.xml cosid-spring-redis/build/test-results/test/TEST-*MixedLeaseFormatTest.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

  cosid-spring-redis-cluster-test:
    name: CosId Spring Redis Cluster Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      # Three masters, one slot range each: the namespaces of the tests land on different nodes.
      - name: Start Redis Cluster
        run: |
          docker run -d --name redis-cluster --network host redis:7.4-alpine sh -c \
            'for port in 7000 7001 7002; do redis-server --port $port --cluster-enabled yes --cluster-config-file nodes-$port.conf --save "" --appendonly no --daemonize yes; done; sleep infinity'
          for _ in $(seq 1 30); do docker exec redis-cluster redis-cli -p 7002 ping > /dev/null 2>&1 && break; sleep 1; done
          docker exec redis-cluster redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-yes
          for _ in $(seq 1 30); do docker exec redis-cluster redis-cli -p 7000 cluster info | grep -q 'cluster_state:ok' && break; sleep 1; done
          docker exec redis-cluster redis-cli -p 7000 cluster info | grep 'cluster_state:ok'

      - name: Test CosId-Spring-Redis on Redis Cluster
        env:
          COSID_TEST_REDIS_CLUSTER_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
        run: scripts/gradle-retry.sh cosid-spring-redis:clean cosid-spring-redis:test --tests '*ContractTest' --tests '*MixedLeaseFormatTest' --tests '*RedisClusterTest'

      # The tests skip themselves without Redis: make sure they really ran, against the cluster.
      - name: Check the cluster tests ran
        run: |
          status=0
          reports=$(ls cosid-spring-redis/build/test-results/test/TEST-*ContractTest.xml cosid-spring-redis/build/test-results/test/TEST-*MixedLeaseFormatTest.xml cosid-spring-redis/build/test-results/test/TEST-*RedisClusterTest.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

  cosid-mongo-test:
    name: CosId Mongo Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Mongo
        run: scripts/gradle-retry.sh cosid-mongo:clean cosid-mongo:check

      # Distributor specs abort tests that outlast their safe guard window: make sure they really ran.
      - name: Check contract tests ran
        run: |
          status=0
          reports=$(ls cosid-mongo/build/test-results/test/TEST-*ContractTest.xml cosid-mongo/build/test-results/test/TEST-*MixedLeaseFormatTest.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

  cosid-proxy-test:
    name: CosId Proxy Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Proxy
        run: scripts/gradle-retry.sh cosid-proxy:clean cosid-proxy:check --info

  cosid-proxy-server-test:
    name: CosId Proxy Server Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Proxy-Server
        env:
          COSID_TEST_REDIS_URI: redis://localhost:6379
        run: scripts/gradle-retry.sh cosid-proxy-server:clean cosid-proxy-server:check

      - name: Test results
        if: always()
        run: grep -h -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' proxy/cosid-proxy-server/build/test-results/test/*.xml

      # The end-to-end tests skip themselves without Redis: make sure they really ran.
      - name: Check end-to-end tests ran
        run: |
          status=0
          for report in proxy/cosid-proxy-server/build/test-results/test/TEST-me.ahoo.cosid.proxy.server.contract.*.xml; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            allowed=0
            if [ "$skipped" -gt "$allowed" ]; then
              echo "::error::$report skipped $skipped tests (allowed $allowed)"
              status=1
            fi
          done
          ls proxy/cosid-proxy-server/build/test-results/test/TEST-me.ahoo.cosid.proxy.server.contract.*.xml > /dev/null || status=1
          exit $status

  cosid-zookeeper-test:
    name: CosId Zookeeper Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Zookeeper
        run: scripts/gradle-retry.sh cosid-zookeeper:clean cosid-zookeeper:check

      # Distributor specs abort tests that outlast their safe guard window: make sure they really ran.
      - name: Check contract tests ran
        run: |
          status=0
          reports=$(ls cosid-zookeeper/build/test-results/test/TEST-*ContractTest.xml cosid-zookeeper/build/test-results/test/TEST-*MixedLeaseFormatTest.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

  # https://github.com/actions/virtual-environments/issues/375
  # https://github.blog/changelog/2020-02-21-github-actions-breaking-change-ubuntu-virtual-environments-will-no-longer-start-the-mysql-service-automatically/
  cosid-jdbc-test:
    name: CosId Jdbc Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    env:
      MYSQL: 5.1
    steps:
      - name: Start Mysql
        run: sudo /etc/init.d/mysql start

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Init CosId-Db
        run: mysql -vvv -h localhost -uroot -proot < cosid-jdbc/src/main/init-script/init-cosid-mysql.sql

      # Named time zones for the DST test of the MySQL server time.
      - name: Load MySQL time zone tables
        run: mysql_tzinfo_to_sql /usr/share/zoneinfo 2>/dev/null | mysql -h localhost -uroot -proot mysql

      - name: Test CosId-Jdbc
        env:
          COSID_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/cosid_db
          COSID_TEST_MYSQL_USERNAME: root
          COSID_TEST_MYSQL_PASSWORD: root
        run: scripts/gradle-retry.sh cosid-jdbc:clean cosid-jdbc:check

      # The real-database tests skip themselves without MySQL or PostgreSQL: make sure they really ran.
      - name: Check real database tests ran
        run: |
          status=0
          reports=$(ls cosid-jdbc/build/test-results/test/TEST-*ContractTest.xml cosid-jdbc/build/test-results/test/TEST-*JdbcMachineLeaseStoreTest.xml cosid-jdbc/build/test-results/test/TEST-*MySqlTest.xml cosid-jdbc/build/test-results/test/TEST-*Postgres*Test.xml cosid-jdbc/build/test-results/test/TEST-*MixedLeaseFormatTest.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

  # The supported Spring Boot and Java versions: the starter, the proxy server (with its virtual-thread test) and the
  # Spring Data Redis contract tests on each. The docs' compatibility table lists the same matrix.
  cosid-compatibility-test:
    name: CosId Compatibility (Boot ${{ matrix.boot }}, Java ${{ matrix.java }})
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [ '4.0.8', '4.1.1' ]
        java: [ '17', '21', '25' ]
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Start Mysql
        run: sudo /etc/init.d/mysql start

      - name: Checkout
        uses: actions/checkout@v7

      # Java 17 compiles; the matrix Java runs the tests.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: |
            ${{ matrix.java }}
            17
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Init CosId-Db
        run: mysql -vvv -h localhost -uroot -proot < cosid-jdbc/src/main/init-script/init-cosid-mysql.sql

      - name: Test the starter, the proxy server and Spring Data Redis
        env:
          COSID_TEST_REDIS_URI: redis://localhost:6379
        run: >-
          scripts/gradle-retry.sh -PspringBootVersion=${{ matrix.boot }} -PtestJavaVersion=${{ matrix.java }}
          cosid-spring-boot-starter:test cosid-proxy-server:test
          cosid-spring-redis:test --tests '*ContractTest' --tests '*MixedLeaseFormatTest'

      - name: Check the tests ran
        run: |
          status=0
          reports=$(ls cosid-spring-boot-starter/build/test-results/test/TEST-*.xml proxy/cosid-proxy-server/build/test-results/test/TEST-me.ahoo.cosid.proxy.server.contract.*.xml cosid-spring-redis/build/test-results/test/TEST-*ContractTest.xml cosid-spring-redis/build/test-results/test/TEST-*MixedLeaseFormatTest.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

  cosid-spring-boot-starter-test:
    name: CosId Spring Boot Starter Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Start Mysql
        run: sudo /etc/init.d/mysql start

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Init CosId-Db
        run: mysql -vvv -h localhost -uroot -proot < cosid-jdbc/src/main/init-script/init-cosid-mysql.sql

      - name: Test CosId-Spring-Boot-Starter
        run: scripts/gradle-retry.sh cosid-spring-boot-starter:clean cosid-spring-boot-starter:check

      # No starter test may be skipped, and the run must have produced reports.
      - name: Check starter tests ran
        run: |
          status=0
          reports=$(ls cosid-spring-boot-starter/build/test-results/test/TEST-*.xml) || status=1
          for report in $reports; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status
