management:
  endpoint:
    health:
      # /actuator/health/liveness answers without asking the stores: use it for container health checks.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - cosid
          - cosidGenerator
          - cosidStringGenerator
springdoc:
  show-actuator: true
server:
  port: 8688
spring:
  application:
    name: ${service.name:cosid-proxy}
  autoconfigure:
    exclude:
      #     - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      # Remove to use a Mongo store (cosid.machine.distributor.type=mongo or cosid.segment.distributor.type=mongo).
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
#  datasource:
#    url: jdbc:mysql://localhost:3306/cosid_db
#    username: root
#    password: root
cosid:
  namespace: ${spring.application.name}
  proxy:
    server:
      auth:
        tokens:
          - ${COSID_PROXY_TOKEN:} # empty: startup fails and asks for a token
  machine:
    enabled: true
    distributor:
      type: redis
  snowflake:
    enabled: true
  segment:
    enabled: true
    distributor:
      type: redis
logging:
  level:
    me.ahoo.cosid: info

