changelog:
  exclude:
    labels:
      - ignore-for-release

  # Labels are applied automatically from the Conventional Commits type of the
  # pull request title, see .github/workflows/labeler.yml.
  categories:
    - title: 🔧 Breaking Changes
      labels:
        - breaking-change
    - title: 🎉 New Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: ⚡ Performance Improvements
      labels:
        - performance
    - title: 📚 Documentation Updates
      labels:
        - documentation
    - title: 🤖 Dependency Updates
      labels:
        - dependencies
        - dependency
    - title: 🔨 Maintenance
      labels:
        - maintenance
        - refactor
    - title: Other Changes
      labels:
        - '*'
