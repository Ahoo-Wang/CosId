# The build setup of every Gradle job, after actions/checkout (a local action lives in the checkout): the JDKs and
# Gradle through gradle/actions/setup-gradle, which validates the wrapper and caches Gradle's user home. The cache is
# written by main only; pull requests read it.
name: Set up the build
description: JDKs and Gradle for a CosId build job
inputs:
  java-version:
    description: The JDKs to install, one per line; the last one is JAVA_HOME
    default: '21'
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
