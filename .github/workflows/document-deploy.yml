name: Documentation Build and Deploy
# The site documents released versions: it is built from a release tag, and pages show that version.
on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to build the site from, such as v4.0.1'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # One directory per published module, named by its artifactId (ArtifactIds, D11), under an index page.
      - name: Generate JavaDoc
        run: ./gradlew javadocSite

      - name: Copy To Documentation
        run: cp -R build/javadoc-site documentation/docs/public/javadoc

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache-dependency-path: documentation/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Build VitePress site
        working-directory: documentation
        run: pnpm install && pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './documentation/docs/.vitepress/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5