# cosid-server (08-remote.md). The backing store is one of cosid.stores (cosid.server.store names it when there are
# several); every value below can come from the environment, e.g. COSID_SERVER_AUTH_TOKENS_0=change-me-to-a-long-random-token.
server:
  port: 8688
spring:
  application:
    name: cosid-server
  # Requests run on virtual threads; the store and generator calls still run on the bounded pool of
  # cosid.server.blocking (503 busy past it), so the number of requests is not what bounds the store.
  # SPRING_THREADS_VIRTUAL_ENABLED=false goes back to Tomcat's platform threads.
  threads:
    virtual:
      enabled: true
management:
  endpoint:
    health:
      # /actuator/health/liveness answers without asking the store: use it for container health checks.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - cosid
springdoc:
  show-actuator: true
cosid:
  namespace: ${spring.application.name}
