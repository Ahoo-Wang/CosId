# Pull request titles become the squash-merge commit message, so they must follow
# Conventional Commits (https://www.conventionalcommits.org). The type also drives
# the release notes labels, see .github/workflows/labeler.yml.
name: Pull Request Title
on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
