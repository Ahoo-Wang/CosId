# Converted from a CosId 4.x configuration by cosid-migration config (09-migration.md §3).
# Not converted as is - review before starting 5.0:
#  - initial-offset of each migrated segment is its next value from apply-result.json: should 5.0 open another store than apply wrote to, its keys start there, leaving a gap instead of issuing the 4.x ids again
#  - cosid.segment.provider.invoice.converter.custom.type = com.example.InvoiceConverter: a 4.x IdConverter; port it to a 5.0 IdCodec
#  - cosid.machine: no time-based generator, so 5.0 needs no machine slot; the machine settings are dropped
cosid:
  namespace: billing
  stores:
    mongo:
      type: mongo
      options:
        database: ids
        writeConcern: majority
  generators:
    default:
      strategy: segment
      store: mongo
      step: 10
      initial-offset: 42
      codec:
      - radix:
          radix: 62
          width: 11
          pad-start: true
    invoice:
      strategy: segment
      store: mongo
      step: 1000
      initial-offset: 42
      codec:
      - custom: com.example.InvoiceConverter
      - date-prefix:
          pattern: yyMMdd
          delimiter: "-"
          source: NOW
      - suffix: -X
