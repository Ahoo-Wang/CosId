# Labels pull requests by the files they change. Used by .github/workflows/labeler.yml.
# Syntax: https://github.com/actions/labeler#match-object

'module: core':
  - changed-files:
      - any-glob-to-any-file: 'cosid-core/**'

'module: jdbc':
  - changed-files:
      - any-glob-to-any-file:
          - 'cosid-jdbc/**'
          - 'cosid-spring-data-jdbc/**'

'module: redis':
  - changed-files:
      - any-glob-to-any-file: 'cosid-spring-redis/**'

'module: zookeeper':
  - changed-files:
      - any-glob-to-any-file: 'cosid-zookeeper/**'

'module: mongo':
  - changed-files:
      - any-glob-to-any-file: 'cosid-mongo/**'

'module: proxy':
  - changed-files:
      - any-glob-to-any-file: 'proxy/**'

'module: spring-boot':
  - changed-files:
      - any-glob-to-any-file: 'cosid-spring-boot-starter/**'

'module: integrations':
  - changed-files:
      - any-glob-to-any-file:
          - 'cosid-jackson/**'
          - 'cosid-mybatis/**'
          - 'cosid-axon/**'
          - 'cosid-activiti/**'
          - 'cosid-flowable/**'

'module: bom':
  - changed-files:
      - any-glob-to-any-file:
          - 'cosid-bom/**'
          - 'cosid-dependencies/**'
          - 'gradle/libs.versions.toml'

'area: test':
  - changed-files:
      - any-glob-to-any-file:
          - 'cosid-test/**'
          - 'cosid-mod-test/**'
          - '**/src/test/**'

'area: benchmark':
  - changed-files:
      - any-glob-to-any-file:
          - 'cosid-benchmark/**'
          - '**/src/jmh/**'

'area: example':
  - changed-files:
      - any-glob-to-any-file: 'examples/**'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'documentation/**'
          - 'document/**'
          - 'docs/**'
          - 'wiki/**'
          - '**/*.md'

'area: build':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.gradle.kts'
          - 'gradle/**'
          - 'gradle.properties'
          - 'config/**'

'area: ci':
  - changed-files:
      - any-glob-to-any-file: '.github/**'
