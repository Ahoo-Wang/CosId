# The checks of every pull request and of main, in one workflow whose last job, CI, is the one result to require.
# - A pull request runs what its changes reach (job changes): Check for any code, a store's TCK for that store, the
#   server and Spring for the stores and modules they build on, the site for documentation/; core, the TCK, the build
#   and this workflow reach everything. main, the nightly schedule and a manual run take everything, plus the probes of
#   versions below the minimum (D28) and the whole Spring Boot x Java matrix.
# - check runs once per push: Check covers every project except those in SKIP_TESTS, whose tests run in their own job
#   (their containers start once); each job uploads its coverage to Codecov under a flag of its own (codecov.yml carries
#   the flags a pull request did not run forward).
# - A newer push to a pull request cancels the run of the older one; runs on main are never cancelled.
name: CI
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: true
permissions:
  contents: read

jobs:
  # Which jobs a pull request needs, and the matrices: the probes and the full Spring matrix run only when full.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      code: ${{ steps.plan.outputs.code }}
      docs: ${{ steps.plan.outputs.docs }}
      jdbc: ${{ steps.plan.outputs.jdbc }}
      mongo: ${{ steps.plan.outputs.mongo }}
      redis: ${{ steps.plan.outputs.redis }}
      zookeeper: ${{ steps.plan.outputs.zookeeper }}
      server: ${{ steps.plan.outputs.server }}
      spring: ${{ steps.plan.outputs.spring }}
      jdbc-matrix: ${{ steps.plan.outputs.jdbc-matrix }}
      redis-matrix: ${{ steps.plan.outputs.redis-matrix }}
      spring-matrix: ${{ steps.plan.outputs.spring-matrix }}
    steps:
      # Each filter matches a file only when every pattern does (predicate-quantifier: every), so the first pattern
      # lists the paths and the others leave out Markdown and documentation.
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            all:
              - '{core/**,store/tck/**,build-logic/**,gradle/**,config/**,scripts/**,bom/**,.github/actions/**,.github/workflows/integration-test.yml,build.gradle.kts,settings.gradle.kts,gradle.properties,gradlew,gradlew.bat,codecov.yml}'
              - '!**/*.md'
            code:
              - '**'
              - '!{docs,documentation,skills}/**'
              - '!**/*.md'
            docs:
              - '{documentation/**,gradle.properties,.github/workflows/integration-test.yml}'
            jdbc:
              - 'store/jdbc/**'
              - '!**/*.md'
            mongo:
              - 'store/mongo/**'
              - '!**/*.md'
            redis:
              - 'store/redis/**'
              - '!**/*.md'
            zookeeper:
              - 'store/zookeeper/**'
              - '!**/*.md'
            server:
              - '{store/**,server/**,spring/autoconfigure/**,integrations/**}'
              - '!**/*.md'
            spring:
              - '{store/**,spring/**,integrations/**}'
              - '!**/*.md'

      - name: Plan the jobs
        id: plan
        env:
          FULL: ${{ github.event_name != 'pull_request' }}
          FILTER: ${{ toJSON(steps.filter.outputs) }}
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          full = os.environ["FULL"] == "true"
          changed = json.loads(os.environ["FILTER"] or "{}") or {}
          def on(name):
              return full or changed.get("all") == "true" or changed.get(name) == "true"
          out = {name: on(name) for name in ("code", "docs", "jdbc", "mongo", "redis", "zookeeper", "server", "spring")}
          out["full"] = full
          jdbc = [
              dict(versions="minimum", mysql="mysql:8.4", mariadb="mariadb:10.11", postgres="postgres:15-alpine",
                   sqlserver="mcr.microsoft.com/mssql/server:2019-latest", dialects="h2,mysql,mariadb,postgresql,sqlserver",
                   tests="", probe=False, coverage=True),
              dict(versions="current", mysql="mysql:9", mariadb="mariadb:11", postgres="postgres:18-alpine",
                   sqlserver="mcr.microsoft.com/mssql/server:2022-latest", dialects="h2,mysql,mariadb,postgresql,sqlserver",
                   tests="", probe=False, coverage=False),
              dict(versions="probe MySQL 8.0, MariaDB 10.6, PostgreSQL 12, SQL Server 2017", mysql="mysql:8.0",
                   mariadb="mariadb:10.6", postgres="postgres:12-alpine", sqlserver="mcr.microsoft.com/mssql/server:2017-latest",
                   dialects="mysql,mariadb,postgresql,sqlserver", tests="", probe=True, coverage=False),
              dict(versions="probe PostgreSQL 13", mysql="mysql:8.4", mariadb="mariadb:10.11", postgres="postgres:13-alpine",
                   sqlserver="mcr.microsoft.com/mssql/server:2019-latest", dialects="postgresql",
                   tests="me.ahoo.cosid.store.jdbc.Postgres*", probe=True, coverage=False),
              dict(versions="probe PostgreSQL 14", mysql="mysql:8.4", mariadb="mariadb:10.11", postgres="postgres:14-alpine",
                   sqlserver="mcr.microsoft.com/mssql/server:2019-latest", dialects="postgresql",
                   tests="me.ahoo.cosid.store.jdbc.Postgres*", probe=True, coverage=False),
          ]
          # D28: once below the 7.0 minimum, to document real compatibility (store/redis README); never blocks.
          redis = [dict(redis="7.0", probe=False, coverage=False), dict(redis="8.10", probe=False, coverage=True),
                   dict(redis="6.2", probe=True, coverage=False)]
          # The lowest supported and the build's Boot on Java 21 and 25; a pull request runs the two diagonals.
          spring = [dict(boot="4.0.9", java="21", coverage=False), dict(boot="4.1.2", java="25", coverage=True),
                    dict(boot="4.0.9", java="25", coverage=False, full=True), dict(boot="4.1.2", java="21", coverage=False, full=True)]
          out["jdbc-matrix"] = [e for e in jdbc if full or not e["probe"]]
          out["redis-matrix"] = [e for e in redis if full or not e["probe"]]
          out["spring-matrix"] = [{k: v for k, v in e.items() if k != "full"} for e in spring if full or not e.get("full")]
          for name, value in out.items():
              print(f"{name}={json.dumps(value) if isinstance(value, list) else str(value).lower()}")
          EOF
          cat "$GITHUB_OUTPUT"

  # Every module's check (compile, Checkstyle, SpotBugs, tests, JaCoCo), the dependency rules and the build-logic
  # tests, except the tests of SKIP_TESTS, which run in their own jobs below.
  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_TESTS: ':store:jdbc,:store:mongo,:store:redis,:store:zookeeper,:store:remote,:server,:spring:autoconfigure,:spring:starter,:integrations:jackson,:integrations:mybatis,:integrations:spring-data-jdbc,:integrations:activiti,:integrations:flowable,:integrations:axon'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      # Each project left out must be checked by another job of this workflow.
      - name: Check the left-out tests run elsewhere
        run: |
          for project in ${SKIP_TESTS//,/ }; do
            grep -q -- "$project:check" .github/workflows/integration-test.yml || { echo "::error::no job checks $project"; exit 1; }
          done

      - name: Check
        run: scripts/gradle-retry.sh check -Pcosid.test.skipProjects=$SKIP_TESTS

      # Publishing builds the javadoc of every module: a broken reference fails the release otherwise.
      - name: Javadoc
        run: ./gradlew javadoc

      - name: Test the benchmark scripts
        run: |
          python3 -I benchmark/compare_test.py
          bash -n benchmark/run-smoke
          bash -n benchmark/run-release
          python3 -I -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' benchmark/aggregate-release

      # Builds the JMH jars and checks their services: every provider of every module, each loading (checkJmhJar).
      - name: Compile and check the benchmark jars
        run: ./gradlew :benchmark:baseline-4x:checkJmhJar :benchmark:v5:checkJmhJar

      - name: Upload the coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: check
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Report the failed tests
        if: failure()
        uses: ./.github/actions/test-reports
        with:
          name: check-test-reports

  # R2-Mongo: the store TCK on a single-node replica set (Testcontainers), on the minimum (6.0) and a current MongoDB;
  # checkContractsRan fails the job when the contract cases were skipped.
  store-mongo:
    name: Store MongoDB (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.mongo == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'mongo:6.0'
            os: ubuntu-latest
            coverage: true
          # MongoDB 8.0.21 and later exit during startup on Linux 6.19 up to 7.0.13 (SERVER-125742: the kernel's rseq
          # change breaks tcmalloc), the kernel of newer ubuntu-24.04 images; ubuntu-22.04 runs 6.8.
          - image: 'mongo:8.0'
            os: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      # The kernel decides whether mongo:8.0 starts (see the matrix); the rest is for comparing with a failure.
      - name: Describe the runner
        run: |
          {
            echo "### Runner"
            echo '```'
            echo "kernel $(uname -r)"
            lscpu | grep -E '^(Model name|CPU\(s\)):'
            for flag in avx avx2; do echo "$flag: $(grep -qw "$flag" /proc/cpuinfo && echo yes || echo no)"; done
            docker info --format 'Docker {{.ServerVersion}}, cgroup v{{.CgroupVersion}}, {{.NCPU}} CPUs, {{.MemTotal}} bytes'
            echo "transparent hugepages: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The 8.0 runner must have a kernel MongoDB 8.0 starts on (see the matrix): when the image drifts to an affected
      # kernel, the job fails here, naming the kernel, instead of losing the 8.0 coverage. Any other startup failure
      # goes on to the TCK, which fails with the output of mongod.
      - name: Check that MongoDB starts on this kernel
        if: startsWith(matrix.image, 'mongo:8')
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run -d --name mongo-probe "$IMAGE" > /dev/null
          for i in $(seq 1 60); do
            logs=$(docker logs mongo-probe 2>&1)
            if grep -qi 'waiting for connections' <<< "$logs"; then break; fi
            if grep -qi 'known incompatibility' <<< "$logs"; then
              grep -i 'known incompatibility' <<< "$logs" | head -1
              docker rm -f mongo-probe > /dev/null
              echo "**$IMAGE does not start on kernel $(uname -r)** (SERVER-125742, Linux 6.19 to 7.0.13): move this matrix entry to a runner with another kernel." >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=$IMAGE does not start on kernel $(uname -r)::SERVER-125742: MongoDB 8.0.21+ exits during startup on Linux 6.19 to 7.0.13; move this matrix entry to a runner with another kernel."
              exit 1
            fi
            sleep 1
          done
          docker rm -f mongo-probe > /dev/null

      - name: Store TCK
        env:
          COSID_TEST_MONGODB_IMAGE: ${{ matrix.image }}
        run: |
          scripts/gradle-retry.sh :store:mongo:check
          echo "**TCK passed** on $COSID_TEST_MONGODB_IMAGE, ${{ matrix.os }}, kernel $(uname -r)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: mongo
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      # A container that did not start: its mongod output is in the failure message of the test results.
      - name: Report the failed tests
        if: failure()
        uses: ./.github/actions/test-reports
        with:
          name: store-mongo-test-reports-${{ strategy.job-index }}

  # D28: one TCK run on MongoDB versions below the 6.0 minimum, to document real compatibility in store/mongo/README.md.
  # Not a support commitment and never blocking: the step may fail, the job stays green and reports the outcome.
  store-mongo-probe:
    name: Store MongoDB probe (${{ matrix.image }}, not supported)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [ 'mongo:4.4', 'mongo:5.0' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Store TCK (probe)
        id: tck
        continue-on-error: true
        env:
          COSID_TEST_MONGODB_IMAGE: ${{ matrix.image }}
        run: scripts/gradle-retry.sh :store:mongo:check

      - name: Report
        run: |
          echo "${{ matrix.image }} TCK probe: ${{ steps.tck.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # R2-Redis: the TCK on standalone Redis (the service, COSID_TEST_REDIS_URI), a primary with a replica (WAIT) and a
  # three-primary Redis Cluster (Testcontainers), on the minimum (7.0, D27) and the latest 8.x; checkContractsRan fails
  # the job if the contract cases did not run.
  store-redis:
    name: Store Redis TCK (Redis ${{ matrix.redis }}${{ matrix.probe && ', probe' || '' }})
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 7.0 (the minimum, D27) and 8.10; on full runs also 6.2 as a probe (D28). See the changes job.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.redis-matrix) }}
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
    env:
      COSID_TEST_REDIS_URI: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Check store/redis
        id: tck
        continue-on-error: ${{ matrix.probe }}
        run: scripts/gradle-retry.sh :store:redis:check -Pcosid.test.redis.image=redis:${{ matrix.redis }}-alpine

      - name: Report the probe
        if: matrix.probe
        run: |
          echo "Redis ${{ matrix.redis }} TCK probe (not supported, D28): ${{ steps.tck.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: redis
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Report the failed tests
        if: failure() && !matrix.probe
        uses: ./.github/actions/test-reports
        with:
          name: store-redis-test-reports-${{ strategy.job-index }}

  # R2-ZK: the store TCK against a real ZooKeeper, on the minimum (3.8) and the primary target (3.9) (D27); the failover
  # case runs its own three-server ensemble in process. checkContractsRan (part of check) fails the job if a contract
  # case did not run.
  store-zookeeper:
    name: Store ZooKeeper (${{ matrix.zookeeper }})
    needs: changes
    if: needs.changes.outputs.zookeeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - zookeeper: '3.8'
            coverage: false
          - zookeeper: '3.9'
            coverage: true
    services:
      zookeeper:
        image: zookeeper:${{ matrix.zookeeper }}
        ports:
          - 2181:2181
        options: >-
          --health-cmd "zkServer.sh status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COSID_TEST_ZOOKEEPER_CONNECT: localhost:2181
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Check
        run: scripts/gradle-retry.sh :store:zookeeper:check

      - name: Upload the coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: zookeeper
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Report the failed tests
        if: failure()
        uses: ./.github/actions/test-reports
        with:
          name: store-zookeeper-test-reports-${{ strategy.job-index }}


  # D28: the TCK once on ZooKeeper below the 3.8 minimum, to record real compatibility (store/zookeeper/README.md),
  # not to support it. The step may fail; the job never does, so this never turns the required checks red.
  store-zookeeper-probe:
    name: Store ZooKeeper probe (${{ matrix.zookeeper }}, unsupported)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        zookeeper: [ '3.6', '3.7' ]
    services:
      zookeeper:
        image: zookeeper:${{ matrix.zookeeper }}
        ports:
          - 2181:2181
        options: >-
          --health-cmd "zkServer.sh status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COSID_TEST_ZOOKEEPER_CONNECT: localhost:2181
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Store TCK (probe)
        id: probe
        continue-on-error: true
        run: scripts/gradle-retry.sh :store:zookeeper:check

      - name: Record the outcome
        if: always()
        run: |
          echo "ZooKeeper ${{ matrix.zookeeper }}: TCK ${{ steps.probe.outcome }} (probe, not supported)" >> "$GITHUB_STEP_SUMMARY"

  # store/jdbc (R2-JDBC): the TCK on every dialect at its minimum and a current version (06-stores.md §2.1, D27). MySQL,
  # MariaDB and PostgreSQL are services reached through COSID_TEST_*_URL; SQL Server, whose image is large, runs on
  # Testcontainers (COSID_TEST_SQLSERVER_IMAGE). checkContractsRan checks each dialect's reports on their own, so a
  # database that was not there fails the job.
  # The probe entries (D28) run the TCK once below the minimum to document real compatibility (store/jdbc/README.md);
  # they are no support commitment: their test step may fail without failing the job, and the summary shows the outcome.
  store-jdbc:
    name: Store JDBC (${{ matrix.versions }})
    needs: changes
    if: needs.changes.outputs.jdbc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # minimum and current; on full runs also the probes (D28). The entries are in the changes job.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.jdbc-matrix) }}
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cosid_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cosid_db
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot || mariadb-admin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: cosid_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Check store/jdbc
        id: tck
        continue-on-error: ${{ matrix.probe }}
        env:
          COSID_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/cosid_db
          COSID_TEST_MYSQL_USERNAME: root
          COSID_TEST_MYSQL_PASSWORD: root
          # MariaDB Connector/J 4 asks for TLS by default; the minimum server (10.11) has none.
          COSID_TEST_MARIADB_URL: jdbc:mariadb://localhost:3307/cosid_db?sslMode=disable
          COSID_TEST_MARIADB_USERNAME: root
          COSID_TEST_MARIADB_PASSWORD: root
          COSID_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/cosid_db
          COSID_TEST_POSTGRES_USERNAME: postgres
          COSID_TEST_POSTGRES_PASSWORD: root
          COSID_TEST_SQLSERVER_IMAGE: ${{ matrix.sqlserver }}
          TESTS: ${{ matrix.tests }}
        run: |
          args=()
          if [ -n "$TESTS" ]; then args=(--tests "$TESTS"); fi
          scripts/gradle-retry.sh :store:jdbc:check "${args[@]}" -Pcosid.store.jdbc.dialects=${{ matrix.dialects }}

      - name: Probe outcome
        if: ${{ always() && matrix.probe }}
        run: |
          echo "### ${{ matrix.versions }}: ${{ steps.tck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          python3 -I - store/jdbc/build/test-results/test >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          for report in sorted(glob.glob(sys.argv[1] + "/TEST-*.xml")):
              suite = ET.parse(report).getroot()
              for case in suite.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      print(f"- {suite.get('name').rsplit('.', 1)[-1]}.{case.get('name')}: {(failure.get('message') or '')[:200]}")
          EOF

      - name: Upload the coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: jdbc
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Report the failed tests
        if: failure() && !matrix.probe
        uses: ./.github/actions/test-reports
        with:
          name: store-jdbc-test-reports-${{ strategy.job-index }}


  # R4-A: store/remote through a real cosid-server, started in process: the store TCK on InMemoryStore, H2 (JDBC) and
  # the Redis service below (08-remote.md); checkContractsRan fails the job when a contract case was skipped. Then the
  # Docker image is built and smoke tested on the same Redis: health public, 401 without the token, a reserve with it.
  server:
    name: Server (remote TCK, image)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
    env:
      COSID_TEST_REDIS_URI: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Remote TCK
        run: scripts/gradle-retry.sh :store:remote:check :server:check

      - name: Check the Redis contracts ran
        run: |
          ls server/build/test-results/test/
          for report in server/build/test-results/test/TEST-*RemoteRedis*.xml; do
            grep -q 'skipped="0"' "$report" || { head -c 2000 "$report"; echo "::error::$report skipped its cases"; exit 1; }
          done

      - name: Build the image
        run: ./gradlew :server:dockerImage

      - name: Smoke test the image
        run: |
          docker run -d --name cosid-server --network host \
            -e COSID_STORES_MAIN_TYPE=redis -e COSID_STORES_MAIN_OPTIONS_URI=redis://localhost:6379 \
            -e COSID_SERVER_AUTH_TOKENS_0=smoke-token-0123456789 "ahoowang/cosid-server:$(grep '^version=' gradle.properties | cut -d= -f2)"
          for i in $(seq 1 60); do curl -fsS localhost:8688/actuator/health/liveness && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8688/ranges:reserve -H 'Content-Type: application/json' \
            -d '{"key":"smoke/a","size":10,"initialOffset":0}')" = 401
          curl -fsS -X POST localhost:8688/ranges:reserve -H 'Authorization: Bearer smoke-token-0123456789' -H 'Content-Type: application/json' \
            -d '{"key":"smoke/a","size":10,"initialOffset":0}' | grep -q '"end":'
          curl -fsS -H 'Authorization: Bearer smoke-token-0123456789' localhost:8688/v3/api-docs | grep -q '/slots:acquire'

      - name: Server logs
        if: failure()
        run: docker logs cosid-server || true

      - name: Upload the coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Report the failed tests
        if: failure()
        uses: ./.github/actions/test-reports
        with:
          name: server-test-reports

  # R3-S: the Spring Boot compatibility matrix of spring/* and integrations (02-modules.md §5): the lowest supported and the build's Boot,
  # on Java 21 and 25. Java 21 compiles, the matrix Java runs the tests; a test run with skipped tests fails the job.
  spring-compatibility:
    name: Spring Boot ${{ matrix.boot }}, Java ${{ matrix.java }}
    needs: changes
    if: needs.changes.outputs.spring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # A pull request runs the diagonals (4.0.9 on 21, 4.1.2 on 25); full runs all four. See the changes job.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.spring-matrix) }}
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
    env:
      COSID_TEST_REDIS_URI: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build (JDK ${{ matrix.java }} and 21)
        uses: ./.github/actions/setup-build
        with:
          java-version: |
            ${{ matrix.java }}
            21

      - name: Check spring/* and integrations
        run: >-
          scripts/gradle-retry.sh -PspringBootVersion=${{ matrix.boot }} -PtestJavaVersion=${{ matrix.java }}
          :spring:autoconfigure:check :spring:starter:check
          :integrations:jackson:check :integrations:mybatis:check :integrations:spring-data-jdbc:check
          :integrations:activiti:check :integrations:flowable:check :integrations:axon:check

      - name: Check the tests ran
        run: |
          status=0
          for report in spring/autoconfigure/build/test-results/test/TEST-*.xml integrations/*/build/test-results/test/TEST-*.xml; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status

      - name: Upload the coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: spring
          files: ./**/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Report the failed tests
        if: failure()
        uses: ./.github/actions/test-reports
        with:
          name: spring-test-reports-${{ strategy.job-index }}


  # The site, without deploying it, so a broken site (a dead link, a VitePress error) shows on the pull request rather
  # than on release day, when document-deploy.yml is dispatched with the release tag. Its steps are those of
  # document-deploy.yml, minus the Javadoc, which no Markdown page links to.
  docs:
    name: Build the site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache-dependency-path: documentation/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Build VitePress site
        working-directory: documentation
        run: pnpm install --frozen-lockfile && pnpm run docs:build

  # The one check to require: green when every job above succeeded or was not needed (skipped), red when one failed
  # or was cancelled.
  ci:
    name: CI
    needs: [ changes, check, store-mongo, store-mongo-probe, store-redis, store-zookeeper, store-zookeeper-probe, store-jdbc, server, spring-compatibility, docs ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'EOF'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          bad = [name for name, result in results.items() if result not in ("success", "skipped")]
          if bad:
              print(f"::error::failed or cancelled: {', '.join(sorted(bad))}")
              sys.exit(1)
          EOF
