# Converted from a CosId 4.x configuration by cosid-migration config (09-migration.md §3).
# Not converted as is - review before starting 5.0:
#  - cosid.segment.distributor.type = proxy: written as store [remote] (store/remote, 08); its baseUrl must point at a 5.0 cosid-server, the 4.x proxy server does not speak the 5.0 API
#  - cosid.proxy.client = coapi: the 5.0 remote store uses the JDK HttpClient; dropped
#  - cosid.snowflake.share: the 4.x layout is no 5.0 preset; it is written as SNOWFLAKE_S with overrides, keep it as is (M3)
#  - cosid.snowflake.share.converter.date-prefix.before-prefix = false: the 5.0 codec list applies in order; check the order of date-prefix and prefix
#  - cosid.snowflake.provider.cosid: the 4.x layout is no 5.0 preset; it is written as SNOWFLAKE_MS with overrides, keep it as is (M3)
#  - cosid.snowflake.provider.odd: the 4.x layout is no 5.0 preset; it is written as SNOWFLAKE_MS with overrides, keep it as is (M3)
#  - cosid.snowflake.provider.odd.converter.type = base58: unknown converter; dropped
#  - cosid.segment.provider.friendly.mode = segment: segment chains are replaced by the 5.0 refill (lookahead, adaptive batch; 04)
#  - cosid.segment.provider.friendly.chain.safe-distance = 2: segment chains are replaced by the 5.0 refill (lookahead, adaptive batch; 04)
#  - cosid.segment.ttl = 60: segment chains are replaced by the 5.0 refill (lookahead, adaptive batch; 04)
#  - cosid.segment.provider.friendly.converter.type = snowflake_friendly: only snowflake ids have a friendly form; dropped
#  - cosid.segment.provider.grouped.group: 4.x used the server's default time zone; the 5.0 period zone is Asia/Shanghai, check it (--zone)
#  - cosid.segment.provider.grouped-inside.group: 4.x used the server's default time zone; the 5.0 period zone is Asia/Shanghai, check it (--zone)
#  - cosid.segment.provider.grouped-plain.group: 4.x used the server's default time zone; the 5.0 period zone is Asia/Shanghai, check it (--zone)
#  - cosid.generator: a generator named [cosid] exists already; the CosIdGenerator is written as [cosid80]
#  - cosid.machine.port = 8080: set owner-key to host:port if the slot should follow it
#  - cosid.machine.distributor.type = stateful_set: the slot is ${POD_ORDINAL}; set it from the pod ordinal
#  - cosid.machine.static.not-before: pass --result apply-result.json; without it the static slot does not start after the 4.x timestamps (09 §4.4)
#  - the 4.x machine state file is not migrated; set cosid.machine.static.state-file to a new file to keep clock-regression protection (05 §4.4)
cosid:
  namespace: edge
  enabled: false
  stores:
    remote:
      type: remote
      options:
        baseUrl: https://cosid-server.example:8688
        token: secret-token
        connectTimeout: 3s
        requestTimeout: 4s
  machine:
    static:
      bits: 8
      slot: "${POD_ORDINAL}"
  generators:
    default:
      strategy: snowflake
      layout: SNOWFLAKE_S
      time-bits: 41
      node-bits: 8
      seq-bits: 12
      seq-reset-threshold: 7
      codec:
      - radix:
          radix: 36
          width: 13
          pad-start: true
      - date-prefix:
          pattern: yyMMdd
          delimiter: ""
          source: NOW
      - prefix: S
    cosid:
      strategy: snowflake
      layout: SNOWFLAKE_MS
      node-bits: 8
      codec:
      - radix:
          radix: 10
          width: 20
          pad-start: true
    odd:
      strategy: snowflake
      layout: SNOWFLAKE_MS
      node-bits: 8
      codec: []
    friendly:
      strategy: segment
      store: remote
      step: 10
      codec: []
    grouped:
      strategy: periodic-segment
      store: remote
      step: 10
      period: YEAR
      zone: Asia/Shanghai
      codec:
      - radix:
          radix: 62
          width: 11
          pad-start: true
      - prefix: G-
      - period:
          delimiter: "-"
      - suffix: '!'
    grouped-inside:
      strategy: periodic-segment
      store: remote
      step: 10
      period: YEAR_MONTH
      zone: Asia/Shanghai
      codec:
      - radix:
          radix: 36
          width: 13
          pad-start: true
      - period:
          delimiter: /
      - date-prefix:
          pattern: yy
          delimiter: "-"
          source: NOW
      - prefix: P
    grouped-plain:
      strategy: periodic-segment
      store: remote
      step: 10
      period: YEAR
      zone: Asia/Shanghai
      codec:
      - period:
          enabled: false
      - prefix: "N"
    cosid80:
      strategy: cosid80
      node-bits: 19
      codec:
      - friendly:
          zone: Asia/Shanghai
          pad-start: false
  metrics:
    generated:
      enabled: true
