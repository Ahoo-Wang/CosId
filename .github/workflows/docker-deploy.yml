name: Docker Image Deploy
on:
  schedule:
    - cron: '0 10 * * *'
  push:
    paths-ignore:
      - 'cosid-benchmark/**'
      - 'docs/**'
      - 'document/**'
      - 'documentation/**'
      - 'examples/**'
      - 'wiki/**'
    # Images are pushed from 4.x and release tags only; pull requests build and smoke-test the image without pushing.
    branches:
      - '4.x'
    tags:
      - 'v*.*.*'
  pull_request:
    paths-ignore:
      - 'cosid-benchmark/**'
      - 'docs/**'
      - 'document/**'
      - 'documentation/**'
      - 'examples/**'
      - 'wiki/**'
    branches:
      - '4.x'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Build Dist
        run: ./gradlew cosid-proxy-server:installDist

      - name: Build image
        run: docker build -t cosid-proxy:smoke proxy/cosid-proxy-server

      - name: Smoke test
        run: proxy/cosid-proxy-server/smoke-test.sh cosid-proxy:smoke

  docker-deploy:
    name: Push Docker image
    needs: [ smoke-test ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Build Dist
        run: ./gradlew cosid-proxy-server:installDist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to AliyunCR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_TOKEN }}

      # latest follows the newest major line only: maintenance releases of older majors (3.x) and pre-releases
      # (4.0.0-M1, -RC1) keep it.
      - name: Latest tag
        id: latest
        run: |
          latest=false
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.[0-9]+\.[0-9]+$ ]] && [ "${BASH_REMATCH[1]}" -ge 4 ]; then
            latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ahoowang/cosid-proxy
            ghcr.io/ahoo-wang/cosid-proxy
            registry.cn-shanghai.aliyuncs.com/ahoo/cosid-proxy
          flavor: |
            latest=${{ steps.latest.outputs.latest }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: proxy/cosid-proxy-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Aliyun ACR rejects OCI attestation manifests (unknown manifest class for
          # application/vnd.oci.empty.v1+json), and attestations are on by default.
          provenance: false
          sbom: false
