name: Documentation Build and Deploy
# The site documents released versions: it is built from a release tag, and pages show that version.
on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to build the site from, such as v4.0.1'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 5.0 has no aggregated Javadoc: each published module (those with a javadocJar) gets its own directory,
      # named by its artifactId (D11), under one index page.
      - name: Generate JavaDoc
        run: ./gradlew javadocJar

      - name: Copy To Documentation
        run: |
          out=documentation/docs/public/javadoc
          mkdir -p "$out"
          links=""
          for dir in $(find . -path '*/build/docs/javadoc' -type d -not -path './build-logic/*' | sort); do
            module=${dir#./}; module=${module%/build/docs/javadoc}
            case "$module" in
              spring/*) artifact="cosid-spring-boot-${module#spring/}" ;;
              extras/*) artifact="cosid-${module#extras/}" ;;
              *) artifact="cosid-${module//\//-}" ;;
            esac
            cp -R "$dir" "$out/$artifact"
            links="$links<li><a href=\"$artifact/index.html\">$artifact</a></li>"
          done
          printf '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CosId JavaDoc</title></head><body><h1>CosId JavaDoc</h1><ul>%s</ul></body></html>\n' "$links" > "$out/index.html"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache-dependency-path: documentation/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Build VitePress site
        working-directory: documentation
        run: pnpm install && pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './documentation/docs/.vitepress/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5