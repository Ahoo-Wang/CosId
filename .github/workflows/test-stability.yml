# L4 (roadmap §5.3): every integration test class of store/*, server, integrations, migration and spring/* runs N times
# (20 by default), each run in a fresh test JVM with the CI retries off, so a timing-dependent test shows up as a failed
# run instead of a retried pass. Each job writes a per-class table to the run summary and uploads the JUnit reports.
# Runs on demand, nightly on `main`, and on a push to a `stability/**` branch (any commit, before it is merged).
name: Test Stability
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Runs per test class'
        default: '20'
  schedule:
    - cron: '0 18 * * *'
  push:
    branches:
      - 'stability/**'
env:
  CI: true
permissions:
  contents: read

jobs:
  stability:
    name: Stability ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        project:
          - ':store:jdbc'
          - ':store:mongo'
          - ':store:redis'
          - ':store:zookeeper'
          - ':store:remote'
          - ':server'
          - ':integrations'
          - ':migration'
          - ':spring:autoconfigure'
    # The Redis contracts of server and the standalone cases of store/redis and spring/autoconfigure use this service;
    # every other store runs on Testcontainers or in process, as in a local build.
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
    env:
      COSID_TEST_REDIS_URI: redis://localhost:6379
      # L3: ReplicaWaitTest has a known race whose fix is not on 5.x yet; leave it out until it is.
      EXCLUDE: ${{ matrix.project == ':store:redis' && '*.ReplicaWaitTest' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile
        run: scripts/gradle-retry.sh ${{ matrix.project }}:testClasses

      - name: Run the tests ${{ inputs.iterations || '20' }} times
        id: loop
        run: |
          out="build/stability/${MATRIX_PROJECT//:/-}"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          scripts/test-stability.sh "$MATRIX_PROJECT" "${{ inputs.iterations || '20' }}" "$out" "-Pcosid.test.exclude=$EXCLUDE"
        env:
          MATRIX_PROJECT: ${{ matrix.project }}

      - name: Summary
        if: always()
        run: cat "${{ steps.loop.outputs.out }}/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-${{ strategy.job-index }}
          path: ${{ steps.loop.outputs.out }}
          retention-days: 14
