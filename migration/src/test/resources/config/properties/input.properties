# A 4.x configuration as properties, in camelCase: both shares, a manual machine id, ZooKeeper segments.
cosid.namespace=legacy
cosid.machine.enabled=true
cosid.machine.distributor.type=manual
cosid.machine.distributor.manual.machineId=7
cosid.snowflake.enabled=true
cosid.segment.enabled=true
cosid.segment.distributor.type=zookeeper
cosid.segment.distributor.zookeeper.timeout=3s
cosid.zookeeper.connectString=zk1:2181,zk2:2181
cosid.zookeeper.sessionTimeout=30s
cosid.zookeeper.retry.maxRetries=3
cosid.segment.provider.biz_order.step=50
cosid.segment.provider.biz_order.group.by=YEAR
cosid.segment.provider.biz_order.group.pattern=yy
cosid.segment.provider.biz_order.converter.type=radix36
cosid.maxConcurrentCalls=64
