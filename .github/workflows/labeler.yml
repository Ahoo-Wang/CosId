# Labels pull requests twice:
# - by changed files ('module: *' and 'area: *' labels, rules in .github/labeler.yml);
# - by the Conventional Commits type of the title (the labels .github/release.yml groups release notes by).
# pull_request_target runs with the base branch's code and never checks out the pull request,
# so it can label pull requests from forks safely.
name: Pull Request Labeler
on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-by-files:
    name: Label by changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label
        uses: actions/labeler@v6
        with:
          sync-labels: true

  label-by-title:
    name: Label by title type
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            // type(scope)!: subject
            const match = /^(\w+)(?:\(([^)]*)\))?(!)?:\s/.exec(title);
            const typeLabels = {
              feat: 'enhancement',
              fix: 'bug',
              perf: 'performance',
              docs: 'documentation',
              refactor: 'refactor',
              build: 'maintenance',
              ci: 'maintenance',
              chore: 'maintenance',
              style: 'maintenance',
              test: 'maintenance',
              revert: 'maintenance',
            };
            const managed = new Set([...Object.values(typeLabels), 'dependencies', 'breaking-change']);
            const wanted = new Set();
            if (match) {
              const [, type, scope, bang] = match;
              if (scope === 'deps') {
                wanted.add('dependencies');
              } else if (typeLabels[type]) {
                wanted.add(typeLabels[type]);
              }
              if (bang || /^BREAKING[ -]CHANGE:/m.test(body)) {
                wanted.add('breaking-change');
              }
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = context.payload.pull_request.labels.map(label => label.name);
            for (const name of current) {
              if (managed.has(name) && !wanted.has(name)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            const toAdd = [...wanted].filter(name => !current.includes(name));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }
            core.info(`Title type labels: ${[...wanted].join(', ') || '(none)'}`);
