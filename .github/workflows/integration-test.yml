name: Integration Test
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'documentation/**'
env:
  CI: true
permissions:
  contents: read

jobs:
  # 5.x: one job runs every module's check (compile, Checkstyle, SpotBugs, tests, JaCoCo), the dependency rules and the
  # build-logic tests. Each store/* module gets its own TCK job here as it lands (02-modules.md §5).
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check
        run: scripts/gradle-retry.sh check

      # Publishing builds the javadoc of every module: a broken reference fails the release otherwise.
      - name: Javadoc
        run: ./gradlew javadoc

      - name: Test the benchmark scripts
        run: |
          python3 -I benchmark/compare_test.py
          bash -n benchmark/run-smoke

      - name: Compile the benchmarks
        run: ./gradlew :benchmark:baseline-4x:jmhJar :benchmark:v5:jmhJar

  # R2-Mongo: the store TCK on a single-node replica set (Testcontainers), on the minimum (6.0) and a current MongoDB;
  # checkContractsRan fails the job when the contract cases were skipped.
  store-mongo:
    name: Store MongoDB (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ 'mongo:6.0', 'mongo:8.0' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Store TCK
        env:
          COSID_TEST_MONGODB_IMAGE: ${{ matrix.image }}
        run: scripts/gradle-retry.sh :store:mongo:check

  # D28: one TCK run on MongoDB versions below the 6.0 minimum, to document real compatibility in store/mongo/README.md.
  # Not a support commitment and never blocking: the step may fail, the job stays green and reports the outcome.
  store-mongo-probe:
    name: Store MongoDB probe (${{ matrix.image }}, not supported)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ 'mongo:4.4', 'mongo:5.0' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Store TCK (probe)
        id: tck
        continue-on-error: true
        env:
          COSID_TEST_MONGODB_IMAGE: ${{ matrix.image }}
        run: scripts/gradle-retry.sh :store:mongo:check

      - name: Report
        run: |
          echo "${{ matrix.image }} TCK probe: ${{ steps.tck.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # R2-Redis: the TCK on standalone Redis (the service, COSID_TEST_REDIS_URI), a primary with a replica (WAIT) and a
  # three-primary Redis Cluster (Testcontainers), on the minimum (7.0, D27) and the latest 8.x; checkContractsRan fails
  # the job if the contract cases did not run.
  store-redis:
    name: Store Redis TCK (Redis ${{ matrix.redis }}${{ matrix.probe && ', probe' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: [ '7.0', '8.10' ]
        probe: [ false ]
        # D28: once below the 7.0 minimum, to document real compatibility (store/redis README); never blocks.
        include:
          - redis: '6.2'
            probe: true
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
    env:
      COSID_TEST_REDIS_URI: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check store/redis
        id: tck
        continue-on-error: ${{ matrix.probe }}
        run: scripts/gradle-retry.sh :store:redis:check -Pcosid.test.redis.image=redis:${{ matrix.redis }}-alpine

      - name: Report the probe
        if: matrix.probe
        run: |
          echo "Redis ${{ matrix.redis }} TCK probe (not supported, D28): ${{ steps.tck.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # R2-ZK: the store TCK against a real ZooKeeper, on the minimum (3.8) and the primary target (3.9) (D27); the failover
  # case runs its own three-server ensemble in process. checkContractsRan (part of check) fails the job if a contract
  # case did not run.
  store-zookeeper:
    name: Store ZooKeeper (${{ matrix.zookeeper }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zookeeper: [ '3.8', '3.9' ]
    services:
      zookeeper:
        image: zookeeper:${{ matrix.zookeeper }}
        ports:
          - 2181:2181
        options: >-
          --health-cmd "zkServer.sh status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COSID_TEST_ZOOKEEPER_CONNECT: localhost:2181
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check
        run: scripts/gradle-retry.sh :store:zookeeper:check

  # D28: the TCK once on ZooKeeper below the 3.8 minimum, to record real compatibility (store/zookeeper/README.md),
  # not to support it. The step may fail; the job never does, so this never turns the required checks red.
  store-zookeeper-probe:
    name: Store ZooKeeper probe (${{ matrix.zookeeper }}, unsupported)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zookeeper: [ '3.6', '3.7' ]
    services:
      zookeeper:
        image: zookeeper:${{ matrix.zookeeper }}
        ports:
          - 2181:2181
        options: >-
          --health-cmd "zkServer.sh status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COSID_TEST_ZOOKEEPER_CONNECT: localhost:2181
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Store TCK (probe)
        id: probe
        continue-on-error: true
        run: scripts/gradle-retry.sh :store:zookeeper:check

      - name: Record the outcome
        if: always()
        run: |
          echo "ZooKeeper ${{ matrix.zookeeper }}: TCK ${{ steps.probe.outcome }} (probe, not supported)" >> "$GITHUB_STEP_SUMMARY"

  # store/jdbc (R2-JDBC): the TCK on every dialect at its minimum and a current version (06-stores.md §2.1, D27). MySQL,
  # MariaDB and PostgreSQL are services reached through COSID_TEST_*_URL; SQL Server, whose image is large, runs on
  # Testcontainers (COSID_TEST_SQLSERVER_IMAGE). checkContractsRan checks each dialect's reports on their own, so a
  # database that was not there fails the job.
  # The probe entries (D28) run the TCK once below the minimum to document real compatibility (store/jdbc/README.md);
  # they are no support commitment: their test step may fail without failing the job, and the summary shows the outcome.
  store-jdbc:
    name: Store JDBC (${{ matrix.versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - versions: minimum
            mysql: mysql:8.4
            mariadb: mariadb:10.11
            postgres: postgres:15-alpine
            sqlserver: mcr.microsoft.com/mssql/server:2019-latest
            dialects: h2,mysql,mariadb,postgresql,sqlserver
            probe: false
          - versions: current
            mysql: mysql:9
            mariadb: mariadb:11
            postgres: postgres:18-alpine
            sqlserver: mcr.microsoft.com/mssql/server:2022-latest
            dialects: h2,mysql,mariadb,postgresql,sqlserver
            probe: false
          - versions: probe MySQL 8.0, MariaDB 10.6, PostgreSQL 12, SQL Server 2017
            mysql: mysql:8.0
            mariadb: mariadb:10.6
            postgres: postgres:12-alpine
            sqlserver: mcr.microsoft.com/mssql/server:2017-latest
            dialects: mysql,mariadb,postgresql,sqlserver
            probe: true
          - versions: probe PostgreSQL 13
            mysql: mysql:8.4
            mariadb: mariadb:10.11
            postgres: postgres:13-alpine
            sqlserver: mcr.microsoft.com/mssql/server:2019-latest
            dialects: postgresql
            tests: me.ahoo.cosid.store.jdbc.Postgres*
            probe: true
          - versions: probe PostgreSQL 14
            mysql: mysql:8.4
            mariadb: mariadb:10.11
            postgres: postgres:14-alpine
            sqlserver: mcr.microsoft.com/mssql/server:2019-latest
            dialects: postgresql
            tests: me.ahoo.cosid.store.jdbc.Postgres*
            probe: true
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cosid_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cosid_db
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot || mariadb-admin ping -h localhost -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: cosid_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check store/jdbc
        id: tck
        continue-on-error: ${{ matrix.probe }}
        env:
          COSID_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/cosid_db
          COSID_TEST_MYSQL_USERNAME: root
          COSID_TEST_MYSQL_PASSWORD: root
          COSID_TEST_MARIADB_URL: jdbc:mariadb://localhost:3307/cosid_db
          COSID_TEST_MARIADB_USERNAME: root
          COSID_TEST_MARIADB_PASSWORD: root
          COSID_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/cosid_db
          COSID_TEST_POSTGRES_USERNAME: postgres
          COSID_TEST_POSTGRES_PASSWORD: root
          COSID_TEST_SQLSERVER_IMAGE: ${{ matrix.sqlserver }}
          TESTS: ${{ matrix.tests }}
        run: |
          args=()
          if [ -n "$TESTS" ]; then args=(--tests "$TESTS"); fi
          scripts/gradle-retry.sh :store:jdbc:check "${args[@]}" -Pcosid.store.jdbc.dialects=${{ matrix.dialects }}

      - name: Probe outcome
        if: ${{ always() && matrix.probe }}
        run: |
          echo "### ${{ matrix.versions }}: ${{ steps.tck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          python3 -I - store/jdbc/build/test-results/test >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          for report in sorted(glob.glob(sys.argv[1] + "/TEST-*.xml")):
              suite = ET.parse(report).getroot()
              for case in suite.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      print(f"- {suite.get('name').rsplit('.', 1)[-1]}.{case.get('name')}: {(failure.get('message') or '')[:200]}")
          EOF

  # R3-S: the Spring Boot compatibility matrix of spring/* (02-modules.md §5): the lowest supported and the build's Boot,
  # on Java 21 and 25. Java 21 compiles, the matrix Java runs the tests; a test run with skipped tests fails the job.
  spring-compatibility:
    name: Spring Boot ${{ matrix.boot }}, Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [ '4.0.8', '4.1.2' ]
        java: [ '21', '25' ]
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
    env:
      COSID_TEST_REDIS_URI: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }} and 21
        uses: actions/setup-java@v6
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'
          cache: gradle

      - name: Check spring/*
        run: >-
          scripts/gradle-retry.sh -PspringBootVersion=${{ matrix.boot }} -PtestJavaVersion=${{ matrix.java }}
          :spring:autoconfigure:check :spring:starter:check

      - name: Check the tests ran
        run: |
          status=0
          for report in spring/autoconfigure/build/test-results/test/TEST-*.xml; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            if [ "$skipped" -gt 0 ]; then
              echo "::error::$report skipped $skipped tests"
              status=1
            fi
          done
          exit $status
