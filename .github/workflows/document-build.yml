name: Documentation Build
# Builds the site, without deploying it, so a broken site (a dead link, a VitePress error) shows on the pull request
# rather than on release day, when document-deploy.yml is dispatched with the release tag. The build steps are those of
# document-deploy.yml, minus the Javadoc, which no Markdown page links to.
on:
  pull_request:
    paths:
      - 'documentation/**'
      - 'gradle.properties'
      - '.github/workflows/document-build.yml'
permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache-dependency-path: documentation/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Build VitePress site
        working-directory: documentation
        run: pnpm install && pnpm run docs:build
