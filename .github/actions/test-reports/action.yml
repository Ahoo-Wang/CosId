# After a failed test run: one annotation per failed test case (shown on the pull request's Files tab and in the run),
# a summary table, and the JUnit reports as an artifact.
name: Report failed tests
description: Annotate failed JUnit test cases and upload the reports
inputs:
  name:
    description: The artifact name, unique within the run
    required: true
runs:
  using: composite
  steps:
    - name: Annotate the failed tests
      shell: bash
      run: python3 -I "$GITHUB_ACTION_PATH/annotate.py" .

    - name: Upload the test reports
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: |
          **/build/test-results/test/*.xml
          **/build/reports/tests/test/
        if-no-files-found: ignore
        retention-days: 14
