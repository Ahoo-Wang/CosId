# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
    paths-ignore:
      - 'benchmark/**'
      - 'docs/**'
      - 'documentation/**'
      - 'skills/**'
  schedule:
    - cron: '17 9 * * 5'

permissions:
  contents: read

# A newer push to a pull request cancels the analysis of the older one; main and the schedule are never cancelled.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests analyse the sources without building them (build-mode none: about a minute, no Gradle); main and the
  # weekly schedule build the project (autobuild), so their results also cover generated and compiled-only code.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the build
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/setup-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: ${{ github.event_name == 'pull_request' && 'none' || 'autobuild' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
