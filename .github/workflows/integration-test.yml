name: Integration Test
on:
  pull_request:
    paths-ignore:
      - 'cosid-benchmark/**'
      - 'docs/**'
      - 'document/**'
      - 'documentation/**'
      - 'examples/**'
      - 'wiki/**'
env:
  CI: true
jobs:
  cosid-core-test:
    name: CosId Core Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Core
        run: ./gradlew cosid-core:clean cosid-core:check

  cosid-jackson-test:
    name: CosId Jackson Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Jackson
        run: ./gradlew cosid-jackson:clean cosid-jackson:check

  cosid-axon-test:
    name: CosId Axon Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Axon
        run: ./gradlew cosid-axon:clean cosid-axon:check

  cosid-activiti-test:
    name: CosId Activiti Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Activiti
        run: ./gradlew cosid-activiti:clean cosid-activiti:check

  cosid-flowable-test:
    name: CosId Flowable Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Flowable
        run: ./gradlew cosid-flowable:clean cosid-flowable:check

  cosid-mybatis-test:
    name: CosId Mybatis Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Mybatis
        run: ./gradlew cosid-mybatis:clean cosid-mybatis:check

  cosid-spring-jdbc-test:
    name: CosId Spring Jdbc Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Spring-Jdbc
        run: ./gradlew cosid-spring-data-jdbc:clean cosid-spring-data-jdbc:check

  cosid-spring-redis-test:
    name: CosId Spring Redis Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Spring-Redis
        env:
          COSID_TEST_REDIS_URI: redis://localhost:6379
        run: ./gradlew cosid-spring-redis:clean cosid-spring-redis:check

  cosid-mongo-test:
    name: CosId Mongo Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Mongo
        run: ./gradlew cosid-mongo:clean cosid-mongo:check

  cosid-proxy-test:
    name: CosId Proxy Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Proxy
        run: ./gradlew cosid-proxy:clean cosid-proxy:check --info

  cosid-proxy-server-test:
    name: CosId Proxy Server Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Proxy-Server
        env:
          COSID_TEST_REDIS_URI: redis://localhost:6379
        run: ./gradlew cosid-proxy-server:clean cosid-proxy-server:check

      - name: Test results
        if: always()
        run: grep -h -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' proxy/cosid-proxy-server/build/test-results/test/*.xml

      # The end-to-end tests skip themselves without Redis: make sure they really ran.
      # ProxyIdSegmentDistributorEndToEndTest has one intentionally @Disabled test (nextMaxIdWhenBack).
      - name: Check end-to-end tests ran
        run: |
          status=0
          for report in proxy/cosid-proxy-server/build/test-results/test/TEST-me.ahoo.cosid.proxy.server.contract.*.xml; do
            skipped=$(grep -o -m1 'skipped="[0-9]*"' "$report" | grep -o '[0-9]*')
            allowed=0
            case "$report" in *ProxyIdSegmentDistributorEndToEndTest.xml) allowed=1 ;; esac
            if [ "$skipped" -gt "$allowed" ]; then
              echo "::error::$report skipped $skipped tests (allowed $allowed)"
              status=1
            fi
          done
          ls proxy/cosid-proxy-server/build/test-results/test/TEST-me.ahoo.cosid.proxy.server.contract.*.xml > /dev/null || status=1
          exit $status

  cosid-zookeeper-test:
    name: CosId Zookeeper Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Test CosId-Zookeeper
        run: ./gradlew cosid-zookeeper:clean cosid-zookeeper:check

  # https://github.com/actions/virtual-environments/issues/375
  # https://github.blog/changelog/2020-02-21-github-actions-breaking-change-ubuntu-virtual-environments-will-no-longer-start-the-mysql-service-automatically/
  cosid-jdbc-test:
    name: CosId Jdbc Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    env:
      MYSQL: 5.1
    steps:
      - name: Start Mysql
        run: sudo /etc/init.d/mysql start

      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Init CosId-Db
        run: mysql -vvv -h localhost -uroot -proot < cosid-jdbc/src/main/init-script/init-cosid-mysql.sql

      - name: Test CosId-Jdbc
        env:
          COSID_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/cosid_db
          COSID_TEST_MYSQL_USERNAME: root
          COSID_TEST_MYSQL_PASSWORD: root
        run: ./gradlew cosid-jdbc:clean cosid-jdbc:check

  cosid-spring-boot-starter-test:
    name: CosId Spring Boot Starter Test
    needs: [ cosid-core-test ]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Start Mysql
        run: sudo /etc/init.d/mysql start

      - name: Checkout
        uses: actions/checkout@master

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          cache: gradle
          settings-path: ${{ github.workspace }}

      - name: Init CosId-Db
        run: mysql -vvv -h localhost -uroot -proot < cosid-jdbc/src/main/init-script/init-cosid-mysql.sql

      - name: Test CosId-Spring-Boot-Starter
        run: ./gradlew cosid-spring-boot-starter:clean cosid-spring-boot-starter:check
